providers = ["python"]

[phases.setup]
nixPkgs = ["python311", "gcc", "unixODBC", "unixODBCDrivers.msodbcsql18"]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && python -m ensurepip --upgrade",
  ". /opt/venv/bin/activate && pip install -r app/requirements.txt"
]

[start]
cmd = ". /opt/venv/bin/activate && export LD_LIBRARY_PATH=$(find /nix/store -name 'libodbc.so.2' 2>/dev/null -exec dirname {} \\; | head -1):$LD_LIBRARY_PATH && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
